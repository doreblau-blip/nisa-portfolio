<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Prevent Search Engines from Indexing this Secret Page -->
    <meta name="robots" content="noindex, nofollow">

    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark only">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mertvenisa</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css?v=1775051100">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Custom Cinematic Minimalist Plain-Page Styles -->
    <style>
        body {
            background-color: #000000 !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 6vw 4vw;
            margin: 0;
            position: relative;
        }

        /* Tiny, Premium absolute 'Close' button to exit back to portfolio */
        .back-home-btn {
            position: absolute;
            top: 3vw;
            left: 4vw;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.35);
            transition: color 0.3s ease, transform 0.3s ease;
            z-index: 99999;
            text-decoration: none;
        }

        .back-home-btn:hover {
            color: #ffffff;
            transform: translateX(-3px);
        }

        .back-home-btn svg {
            transition: transform 0.3s ease;
        }

        .back-home-btn:hover svg {
            transform: translateX(-2px);
        }

        /* Story Immersive Viewer Container */
        .story-viewer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1400px; /* Expanded significantly to house arrows next to a much larger container */
            position: relative;
            z-index: 10;
        }

        /* Layout wrapper placing arrows next to the slider */
        .story-layout-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 25px;
            position: relative;
        }

        /* Slide Frame Box */
        .story-container {
            position: relative;
            flex: 1;
            max-width: 1200px; /* High-definition 1200px widescreen display */
            aspect-ratio: 16/9; /* Beautiful widescreen 16:9 cinematic ratio */
            background-color: #050505;
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
        }

        /* Active Image Frame */
        .story-slide-frame {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .story-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            image-rendering: -webkit-optimize-contrast; /* Optimizes crispness of vector line-art on Safari/Chrome */
            image-rendering: crisp-edges;
        }

        .story-image.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Glassmorphism Control Arrows (Positioned Outside Next to Container) */
        .story-arrow {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 20;
            flex-shrink: 0;
        }

        .story-arrow:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }

        .story-arrow:active {
            transform: scale(0.96);
        }

        .story-arrow svg {
            width: 22px;
            height: 22px;
            transition: transform 0.3s ease;
        }

        .story-arrow.prev svg {
            transform: translateX(-1px);
        }

        .story-arrow.next svg {
            transform: translateX(1px);
        }

        .story-arrow.prev:hover svg {
            transform: translateX(-3px);
        }

        .story-arrow.next:hover svg {
            transform: translateX(3px);
        }

        /* Slide Counter Indicator centered below the layout */
        .story-counter {
            font-family: var(--font-family);
            font-size: 0.9rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
            margin-top: 2rem;
            text-align: center;
        }

        /* Outro screen style */
        .outro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .outro-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .outro-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 25px;
            padding: 20px;
        }

        .outro-note {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 4px;
            margin: 0 0 10px 0;
            text-transform: lowercase;
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { color: rgba(255, 255, 255, 0.3); text-shadow: 0 0 5px rgba(255,255,255,0); }
            100% { color: rgba(255, 255, 255, 0.55); text-shadow: 0 0 10px rgba(255, 255, 255, 0.1); }
        }

        .outro-play-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
            padding: 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin: 10px 0;
        }

        .outro-play-btn:hover {
            background: #ffffff;
            color: #000000;
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            border-color: #ffffff;
        }

        .outro-play-btn svg {
            width: 28px;
            height: 28px;
        }
        
        .outro-play-btn .outro-play-icon {
            transform: translateX(2px);
            transition: transform 0.3s ease;
        }

        .outro-play-btn:hover .outro-play-icon {
            transform: translateX(2px) scale(1.05);
        }

        .outro-meta {
            font-family: 'Montserrat', sans-serif;
            margin-top: 5px;
        }

        .outro-song-title {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
        }

        /* Centered visualizer wave */
        .outro-wave {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 20px;
            width: auto;
            margin-top: 10px;
        }

        .outro-wave span {
            width: 3px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.3);
            animation: outro-bounce 0.8s ease-in-out infinite alternate;
            transform-origin: bottom;
            animation-play-state: paused;
            border-radius: 2px;
            transition: background-color 0.3s ease;
        }

        .outro-wave.playing span {
            animation-play-state: running;
            background-color: rgba(255, 255, 255, 0.65);
        }

        .outro-wave span:nth-child(1) { height: 40%; animation-duration: 0.6s; }
        .outro-wave span:nth-child(2) { height: 75%; animation-duration: 0.8s; animation-delay: 0.15s; }
        .outro-wave span:nth-child(3) { height: 100%; animation-duration: 0.9s; animation-delay: 0.3s; }
        .outro-wave span:nth-child(4) { height: 50%; animation-duration: 0.7s; animation-delay: 0.45s; }
        .outro-wave span:nth-child(5) { height: 85%; animation-duration: 0.85s; animation-delay: 0.1s; }
        .outro-wave span:nth-child(6) { height: 35%; animation-duration: 0.65s; animation-delay: 0.25s; }
        .outro-wave span:nth-child(7) { height: 95%; animation-duration: 0.95s; animation-delay: 0.35s; }
        .outro-wave span:nth-child(8) { height: 60%; animation-duration: 0.75s; animation-delay: 0.2s; }

        @keyframes outro-bounce {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            body {
                padding: 6vw 4vw;
                justify-content: flex-start;
                overflow-y: auto;
            }
            .story-viewer-section {
                margin-top: 15vh;
            }
            .story-layout-wrapper {
                gap: 12px;
            }
            .story-arrow {
                width: 44px;
                height: 44px;
            }
            .story-arrow svg {
                width: 18px;
                height: 18px;
            }
            .back-home-btn {
                top: 6vw;
                left: 6vw;
            }
        }
    </style>
</head>

<body>
    <div id="page-loader"><div class="loader"></div></div>

    <!-- Tiny, Premium 'Close' button to return to home -->
    <a href="index.html" class="back-home-btn" aria-label="Back to Home">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>close</span>
    </a>

    <!-- Immersive Story Viewer Section -->
    <div class="story-viewer-section">
        <div class="story-layout-wrapper">
            <!-- Navigation Arrow Left -->
            <button type="button" class="story-arrow prev" id="btn-prev" aria-label="Previous Scene">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>

            <!-- Slide Container -->
            <div class="story-container">
                <!-- Active Image Viewframe -->
                <div class="story-slide-frame" id="slide-frame">
                    <img id="active-image" class="story-image" src="" alt="Story Scene">
                    
                    <!-- Centered Outro Screen (Special Scene 21) -->
                    <div id="outro-screen" class="outro-screen">
                        <div class="outro-content">
                            <h2 class="outro-note">şarkıyı dinlemeden gitme.</h2>
                            
                            <button type="button" id="outro-play-btn" class="outro-play-btn" aria-label="Play/Pause Music">
                                <!-- Play Icon -->
                                <svg class="outro-play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                </svg>
                                <!-- Pause Icon -->
                                <svg class="outro-pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                    <rect x="6" y="4" width="4" height="16"></rect>
                                    <rect x="14" y="4" width="4" height="16"></rect>
                                </svg>
                            </button>
                            
                            <div class="outro-meta">
                                <span class="outro-song-title">Ars Longa &mdash; Ceviz Rengi Sandıklar</span>
                            </div>
                            
                            <!-- Premium Centered CSS Wave Visualizer -->
                            <div class="outro-wave" id="outro-wave">
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </div>
                        <audio id="story-audio" src="audio/ceviz-rengi-sandiklar.mp3" preload="auto"></audio>
                    </div>
                </div>
            </div>

            <!-- Navigation Arrow Right -->
            <button type="button" class="story-arrow next" id="btn-next" aria-label="Next Scene">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>

        <!-- Slide Counter Display Below -->
        <div class="story-counter" id="slide-counter">00 / 00</div>
    </div>

    <!-- Custom Cursor & Loader logic (Self-contained) -->
    <script src="./cursor.js?v=1774950400"></script>
    <script src="./loader.js"></script>

    <!-- Story Navigation Engine -->
    <script>
        // Story Scenes Database (User can add/modify JPEGs here!)
        const storyScenes = [
            {
                img: 'images/doodle/scene0.png',
                title: '00. Giriş'
            },
            {
                img: 'images/doodle/scene1.png',
                title: '01. Yarım Kalan Elma'
            },
            {
                img: 'images/doodle/scene2.png',
                title: '02. Yarım Kalan Diyalog'
            },
            {
                img: 'images/doodle/scene3.png',
                title: '03. Yarım Kalmışlık'
            },
            {
                img: 'images/doodle/scene4.png',
                title: '04. Asılı Kalmak'
            },
            {
                img: 'images/doodle/scene5.png',
                title: '05. Sabaha Karşı'
            },
            {
                img: 'images/doodle/scene6.png',
                title: '06. Kaybetmek'
            },
            {
                img: 'images/doodle/scene7.png',
                title: '07. Canımdan Can Gitmesi'
            },
            {
                img: 'images/doodle/scene8.png',
                title: '08. Eski Kavgalar'
            },
            {
                img: 'images/doodle/scene9.png',
                title: '09. Merak Etmek'
            },
            {
                img: 'images/doodle/scene10.png',
                title: '10. Kırıcı Mesajlar'
            },
            {
                img: 'images/doodle/scene11.png',
                title: '11. Eski Halimiz'
            },
            {
                img: 'images/doodle/scene12.png',
                title: '12. Kırgınlık ve Tükenmişlik'
            },
            {
                img: 'images/doodle/scene13.png',
                title: '13. Kafamdakiler'
            },
            {
                img: 'images/doodle/scene14.png',
                title: '14. Sevmemek'
            },
            {
                img: 'images/doodle/scene15.png',
                title: '15. Sabit Kalanlar'
            },
            {
                img: 'images/doodle/scene16.png',
                title: '16. Kendimi Bütün Hissetmek'
            },
            {
                img: 'images/doodle/scene17.png',
                title: '17. Tamamlanmamış Bir Hikaye'
            },
            {
                img: 'images/doodle/scene18.png',
                title: '18. Kendimi Durdurmakta Zorlanmak'
            },
            {
                img: 'images/doodle/scene19.png',
                title: '19. Ceviz Rengi Sandıklar'
            },
            {
                img: 'images/doodle/scene20.png',
                title: '20. Seni Çok Seveceğim Her Zaman'
            },
            {
                type: 'outro',
                title: 'Outro'
            }
        ];

        let currentIndex = 0;
        const totalScenes = storyScenes.length;

        // UI elements
        const activeImg = document.getElementById('active-image');
        const slideCounter = document.getElementById('slide-counter');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        // Outro / Audio elements
        const outroScreen = document.getElementById('outro-screen');
        const outroPlayBtn = document.getElementById('outro-play-btn');
        const playIcon = outroPlayBtn.querySelector('.outro-play-icon');
        const pauseIcon = outroPlayBtn.querySelector('.outro-pause-icon');
        const storyAudio = document.getElementById('story-audio');
        const outroWave = document.getElementById('outro-wave');

        function updateScene(index, direction) {
            const scene = storyScenes[index];

            if (scene.type === 'outro') {
                activeImg.style.opacity = '0';
                activeImg.style.transform = direction === 'next' ? 'scale(0.98) translateX(-10px)' : 'scale(0.98) translateX(10px)';
                
                setTimeout(() => {
                    activeImg.style.display = 'none';
                    outroScreen.style.display = 'flex';
                    setTimeout(() => {
                        outroScreen.classList.add('active');
                    }, 50);
                }, 250);
            } else {
                // Moving back to normal slides
                if (outroScreen.style.display !== 'none') {
                    outroScreen.classList.remove('active');
                    setTimeout(() => {
                        outroScreen.style.display = 'none';
                        activeImg.style.display = 'block';
                        activeImg.src = scene.img;
                        activeImg.alt = scene.title;
                        
                        activeImg.onload = () => {
                            activeImg.style.transform = 'scale(1) translateX(0)';
                            activeImg.style.opacity = '1';
                        };
                        
                        if (activeImg.complete) {
                            activeImg.style.transform = 'scale(1) translateX(0)';
                            activeImg.style.opacity = '1';
                        }
                    }, 250);
                } else {
                    // Normal-to-normal transitions
                    activeImg.style.opacity = '0';
                    activeImg.style.transform = direction === 'next' ? 'scale(0.98) translateX(-10px)' : 'scale(0.98) translateX(10px)';

                    setTimeout(() => {
                        activeImg.src = scene.img;
                        activeImg.alt = scene.title;
                        
                        activeImg.onload = () => {
                            activeImg.style.transform = 'scale(1) translateX(0)';
                            activeImg.style.opacity = '1';
                        };
                        
                        if (activeImg.complete) {
                            activeImg.style.transform = 'scale(1) translateX(0)';
                            activeImg.style.opacity = '1';
                        }
                    }, 250);
                }
            }

            // Format counter to show leading zero
            const formattedCur = String(index + 1).padStart(2, '0');
            const formattedTot = String(totalScenes).padStart(2, '0');
            slideCounter.textContent = `${formattedCur} / ${formattedTot}`;
        }

        // Play/Pause Audio Toggle for Outro
        outroPlayBtn.addEventListener('click', () => {
            if (storyAudio.paused) {
                storyAudio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                outroWave.classList.add('playing');
            } else {
                storyAudio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                outroWave.classList.remove('playing');
            }
        });

        // Reset state when audio ends
        storyAudio.addEventListener('ended', () => {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            outroWave.classList.remove('playing');
        });

        // Navigation actions
        function showNext() {
            currentIndex = (currentIndex + 1) % totalScenes;
            updateScene(currentIndex, 'next');
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + totalScenes) % totalScenes;
            updateScene(currentIndex, 'prev');
        }

        // Event listeners
        btnNext.addEventListener('click', showNext);
        btnPrev.addEventListener('click', showPrev);

        // Keyboard navigation (Left & Right arrows)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                showNext();
            } else if (e.key === 'ArrowLeft') {
                showPrev();
            }
        });

        // Initialize First Slide
        window.addEventListener('DOMContentLoaded', () => {
            updateScene(currentIndex, 'next');
        });
    </script>
</body>

</html>
